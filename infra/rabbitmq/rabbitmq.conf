# Phase 0 RabbitMQ configuration for the official management image.

management.tcp.ip = 0.0.0.0
management.tcp.port = 15672
loopback_users.guest = false

# Place amq.rabbitmq.event in the application vhost so Head can subscribe
# with the same non-guest credentials used for ai_tasks topology.
event_exchange.vhost = /discordcombatai

# Topology definitions are imported by ensure_app_user_entrypoint.sh after the
# Compose-injected app user exists (definitions.json intentionally omits secrets).
