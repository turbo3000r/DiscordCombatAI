name: Brokers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  brokers:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra integration

      - name: Broker integration tests
        run: uv run pytest tests/integration -m integration -q
