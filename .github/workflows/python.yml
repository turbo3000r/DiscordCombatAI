name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff
        run: uv run ruff check src

      - name: Mypy
        run: uv run mypy src

      - name: Unit and acceptance tests
        run: uv run pytest tests/unit tests/acceptance -q
