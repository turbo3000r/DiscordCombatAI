name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # Manual runs always execute every check; PRs only run affected slices.
      python: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.python }}
      launcher: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.launcher }}
      brokers: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.brokers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'infra/**'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
            launcher:
              - '.github/workflows/ci.yml'
              - 'launcher/**'
            brokers:
              - '.github/workflows/ci.yml'
              - 'infra/**'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - 'tests/integration/**'
              - 'tests/unit/infra/**'

  python:
    name: Python (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Unit and acceptance tests
        run: uv run pytest tests/unit tests/acceptance -q

  launcher:
    name: Launcher (vet, test)
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  brokers:
    name: Broker integration
    needs: changes
    if: needs.changes.outputs.brokers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra integration

      - name: Broker integration tests
        run: uv run pytest tests/integration -m integration -q

  ci:
    name: CI
    needs: [changes, python, launcher, brokers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful or skipped jobs
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection failed: ${{ needs.changes.result }}"
            exit 1
          fi
          for result in \
            "${{ needs.python.result }}" \
            "${{ needs.launcher.result }}" \
            "${{ needs.brokers.result }}"
          do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required CI job finished with: $result"
              exit 1
            fi
          done
          echo "CI passed (jobs succeeded or were skipped as out of path scope)."
