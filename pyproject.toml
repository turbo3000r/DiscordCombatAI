[project]
name = "discordcombatai"
version = "0.1.2"
description = "AI-powered combat bot for Discord"
authors = [
    {name = "turbo3000r",email = "64685722+turbo3000r@users.noreply.github.com"}
]
license = "Apache License 2.0"
readme = "README.md"
requires-python = ">=3.14,<4.0.0"

dependencies = [
    "discord-py (>=2.3.2,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "google-generativeai (>=0.8.0)",
    "fastapi (>=0.110.0)",
    "uvicorn[standard] (>=0.27.0)",
    "psutil (>=5.9.0)",
    "aiofiles (>=23.0.0)",
    "aiohttp (>=3.9.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "langgraph (>=1.1.9,<2.0.0)",
    "ruff (>=0.15.11,<0.16.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
