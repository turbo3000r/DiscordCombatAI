[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-combat-ai"
version = "0.1.0"
description = "DiscordCombatAI — distributed AI Discord bot foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.17,<2",
  "azure-cosmos>=4.7,<5",
  "azure-storage-blob>=12.20,<13",
  "azure-storage-queue>=12.10,<13",
  "azure-data-tables>=12.5,<13",
  "azure-messaging-webpubsubservice>=1.1,<2",
]
head = [
  "aio-pika>=10.0.1",
  "aiohttp>=3.14.1",
  "azure-messaging-webpubsubclient>=1.1.0",
  "discord-combat-ai[azure]",
  "paho-mqtt>=2.1.0",
  "psutil>=7.2.2",
]
bot = [
  "discord-combat-ai[azure]",
  "celery>=5.4,<6",
  "kombu>=5.3,<6",
  "paho-mqtt>=2.1,<3",
  "discord.py>=2.6,<3",
  "httpx>=0.27,<1",
  "google-genai>=1.0,<2",
]
ai-worker = [
  "celery>=5.4,<6",
  "google-genai>=1.75.0",
  "kombu>=5.3,<6",
  "langgraph>=1.2.11",
  "paho-mqtt>=2.1,<3",
]
web = [
  "discord-combat-ai[azure]",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.8,<3",
]
dev-support = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "paho-mqtt>=2.1,<3",
  "httpx>=0.27,<1",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "PyYAML>=6.0.2,<7",
  "types-paho-mqtt>=1.6,<2",
  "types-psutil>=7.2.2.20260518",
  "httpx>=0.27,<1",
]
integration = [
  "discord-combat-ai[dev]",
  "paho-mqtt>=2.1,<3",
  "kombu>=5.3,<6",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/shared",
  "src/head",
  "src/bot",
  "src/ai_worker",
  "src/dev_support",
  "src/web",
]

[tool.hatch.build.targets.wheel.sources]
"src/shared" = "shared"
"src/head" = "head"
"src/bot" = "bot"
"src/ai_worker" = "ai_worker"
"src/dev_support" = "dev_support"
"src/web" = "web"

[tool.hatch.build.targets.wheel.force-include]
"src/bot/resources/generic_environments" = "bot/resources/generic_environments"
"src/bot/localization/lang" = "bot/localization/lang"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
markers = [
  "integration: requires local Docker Compose brokers",
  "azure_live: opt-in live Azure resources (never default)",
  "acceptance: scenario ownership and phase acceptance coverage",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shared", "head", "bot", "ai_worker", "dev_support", "web"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "azure.*",
  "celery.*",
  "kombu.*",
  "paho.*",
  "yaml",
]
ignore_missing_imports = true
