services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - dca-internal
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-discordcombatai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me-in-env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/discordcombatai}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/ensure_app_user_entrypoint.sh:/ensure_app_user_entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/ensure_app_user_entrypoint.sh"]
    networks:
      - dca-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s

  head:
    image: ${LAUNCHER_GHCR_NAMESPACE:-discord-combat-ai}/head:${APPLICATION_VERSION:-local}
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:9800:9800"
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION:-}
      HEAD_NODE_ID: ${NODE_ID:-node-local}
      HEAD_GITHUB_REPO: ${HEAD_GITHUB_REPO:-}
      HEAD_MOSQUITTO_HOST: ${HEAD_MOSQUITTO_HOST:-mosquitto}
      HEAD_MOSQUITTO_PORT: ${HEAD_MOSQUITTO_PORT:-1883}
      HEAD_RABBITMQ_HOST: ${HEAD_RABBITMQ_HOST:-rabbitmq}
      HEAD_RABBITMQ_PORT: ${HEAD_RABBITMQ_PORT:-5672}
      HEAD_RABBITMQ_USER: ${HEAD_RABBITMQ_USER:-discordcombatai}
      HEAD_RABBITMQ_PASS: ${HEAD_RABBITMQ_PASS:-change-me-in-env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/discordcombatai}
      HEAD_LAUNCHER_IPC_URL: ${HEAD_LAUNCHER_IPC_URL:-http://host.docker.internal:9700}
      HEAD_LAUNCHER_IPC_SECRET_FILE: /run/secrets/launcher_ipc_secret
      HEAD_IPC_BIND: ${HEAD_IPC_BIND:-0.0.0.0}
      HEAD_IPC_PORT: ${HEAD_IPC_PORT:-9800}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      HEAD_AZURE_CLIENT_ID: ${HEAD_AZURE_CLIENT_ID:-}
      HEAD_AZURE_CLIENT_SECRET: ${HEAD_AZURE_CLIENT_SECRET:-}
      AZURE_COSMOS_ENDPOINT: ${AZURE_COSMOS_ENDPOINT:-}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_WEBPUBSUB_ENDPOINT: ${AZURE_WEBPUBSUB_ENDPOINT:-}
      AZURE_WEBPUBSUB_HUB_NAME: ${AZURE_WEBPUBSUB_HUB_NAME:-discordcombatai}
      AZURE_METRICS_TABLE: ${AZURE_METRICS_TABLE:-NodeMetrics}
      AZURE_LOG_ARCHIVE_CONTAINER: ${AZURE_LOG_ARCHIVE_CONTAINER:-service-logs}
    volumes:
      - ${LAUNCHER_IPC_SECRET_FILE:-./.secrets/launcher_ipc_secret}:/run/secrets/launcher_ipc_secret:ro
    networks:
      - dca-internal

  bot:
    image: ${LAUNCHER_GHCR_NAMESPACE:-discord-combat-ai}/bot:${APPLICATION_VERSION:-local}
    profiles: [application]
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION:-}
      NODE_ID: ${NODE_ID:-node-local}
      BOT_NODE_ID: ${NODE_ID:-node-local}
      DCA_RUNTIME_MODE: ${DCA_RUNTIME_MODE:-production}
      # Required by Bot at process start (runtime fail-closed). Do not use
      # Compose required-interpolation here: Docker interpolates profile-gated
      # services during `config` / broker-only `up`, which must work without
      # a filled .env.
      DISCORD_DEVELOPMENT_GUILD_ID: ${DISCORD_DEVELOPMENT_GUILD_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-replace-me-in-env}
      BOT_MOSQUITTO_HOST: ${BOT_MOSQUITTO_HOST:-mosquitto}
      BOT_MOSQUITTO_PORT: ${BOT_MOSQUITTO_PORT:-1883}
      BOT_RABBITMQ_HOST: ${BOT_RABBITMQ_HOST:-rabbitmq}
      BOT_RABBITMQ_PORT: ${BOT_RABBITMQ_PORT:-5672}
      BOT_RABBITMQ_USER: ${BOT_RABBITMQ_USER:-discordcombatai}
      BOT_RABBITMQ_PASS: ${BOT_RABBITMQ_PASS:-change-me-in-env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/discordcombatai}
      BOT_DRAIN_PROGRESS_INTERVAL_SEC: ${BOT_DRAIN_PROGRESS_INTERVAL_SEC:-5}
      BOT_AI_TASK_STALL_TIMEOUT_SEC: ${BOT_AI_TASK_STALL_TIMEOUT_SEC:-120}
      BOT_AI_TASK_TIMEOUT_SEC: ${BOT_AI_TASK_TIMEOUT_SEC:-900}
      BOT_QUEUE_POLL_INTERVAL_SEC: ${BOT_QUEUE_POLL_INTERVAL_SEC:-300}
      BOT_SUGGESTION_SWEEP_INTERVAL_SEC: ${BOT_SUGGESTION_SWEEP_INTERVAL_SEC:-900}
      BOT_SUGGESTION_SWEEP_MIN_AGE_SEC: ${BOT_SUGGESTION_SWEEP_MIN_AGE_SEC:-600}
      BOT_SUGGESTION_MAX_DM_ATTEMPTS: ${BOT_SUGGESTION_MAX_DM_ATTEMPTS:-5}
      BOT_SUGGESTION_CLAIM_TIMEOUT_SEC: ${BOT_SUGGESTION_CLAIM_TIMEOUT_SEC:-120}
      BOT_GUILD_SYNC_INTERVAL_SEC: ${BOT_GUILD_SYNC_INTERVAL_SEC:-3600}
      BOT_HEARTBEAT_INTERVAL_SEC: ${BOT_HEARTBEAT_INTERVAL_SEC:-30}
      BOT_STATUS_PUSH_INTERVAL_SEC: ${BOT_STATUS_PUSH_INTERVAL_SEC:-60}
      BOT_SHUTDOWN_GRACE_SEC: ${BOT_SHUTDOWN_GRACE_SEC:-30}
      BOT_CONTROL_DRAIN_TIMEOUT_SEC: ${BOT_CONTROL_DRAIN_TIMEOUT_SEC:-45}
      BOT_ACTIVATION_GRANT_MAX_TTL_SEC: ${BOT_ACTIVATION_GRANT_MAX_TTL_SEC:-60}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      BOT_AZURE_CLIENT_ID: ${BOT_AZURE_CLIENT_ID:-}
      BOT_AZURE_CLIENT_SECRET: ${BOT_AZURE_CLIENT_SECRET:-}
      AZURE_COSMOS_ENDPOINT: ${AZURE_COSMOS_ENDPOINT:-}
      AZURE_COSMOS_DATABASE: ${AZURE_COSMOS_DATABASE:-DiscordCombatAI}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_QUEUE_NAME: ${AZURE_QUEUE_NAME:-suggestions}
      AZURE_STATUS_BLOB_CONTAINER: ${AZURE_STATUS_BLOB_CONTAINER:-coordination}
      AZURE_STATUS_BLOB_NAME: ${AZURE_STATUS_BLOB_NAME:-bot_status.json}
    networks:
      - dca-internal

  ai_worker:
    image: ${LAUNCHER_GHCR_NAMESPACE:-discord-combat-ai}/ai_worker:${APPLICATION_VERSION:-local}
    profiles: [application]
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION:-}
      NODE_ID: ${NODE_ID:-node-local}
      AI_WORKER_NODE_ID: ${NODE_ID:-node-local}
      AI_WORKER_MOSQUITTO_HOST: ${AI_WORKER_MOSQUITTO_HOST:-mosquitto}
      AI_WORKER_MOSQUITTO_PORT: ${AI_WORKER_MOSQUITTO_PORT:-1883}
      AI_WORKER_RABBITMQ_HOST: ${AI_WORKER_RABBITMQ_HOST:-rabbitmq}
      AI_WORKER_RABBITMQ_PORT: ${AI_WORKER_RABBITMQ_PORT:-5672}
      AI_WORKER_RABBITMQ_USER: ${AI_WORKER_RABBITMQ_USER:-discordcombatai}
      AI_WORKER_RABBITMQ_PASS: ${AI_WORKER_RABBITMQ_PASS:-change-me-in-env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/discordcombatai}
      AI_WORKER_LLM_MAX_RETRIES: ${AI_WORKER_LLM_MAX_RETRIES:-2}
      ENVIRONMENT_MAX_ENHANCER_RETRIES: ${ENVIRONMENT_MAX_ENHANCER_RETRIES:-3}
      ENVIRONMENT_TASK_DEADLINE_SEC: ${ENVIRONMENT_TASK_DEADLINE_SEC:-600}
      ENVIRONMENT_MAX_INPUT_TOKENS: ${ENVIRONMENT_MAX_INPUT_TOKENS:-120000}
      ENVIRONMENT_MAX_OUTPUT_TOKENS: ${ENVIRONMENT_MAX_OUTPUT_TOKENS:-30000}
      BATTLE_MAX_MODIFIER_RETRIES: ${BATTLE_MAX_MODIFIER_RETRIES:-3}
      BATTLE_TASK_DEADLINE_SEC: ${BATTLE_TASK_DEADLINE_SEC:-840}
      BATTLE_MAX_INPUT_TOKENS: ${BATTLE_MAX_INPUT_TOKENS:-350000}
      BATTLE_MAX_OUTPUT_TOKENS: ${BATTLE_MAX_OUTPUT_TOKENS:-90000}
      AI_WORKER_CELERY_CONCURRENCY: ${AI_WORKER_CELERY_CONCURRENCY:-1}
      AI_WORKER_PROGRESS_HEARTBEAT_SEC: ${AI_WORKER_PROGRESS_HEARTBEAT_SEC:-30}
      AI_WORKER_HEARTBEAT_INTERVAL_SEC: ${AI_WORKER_HEARTBEAT_INTERVAL_SEC:-30}
      AI_WORKER_TRANSPORT_SHELL: ${AI_WORKER_TRANSPORT_SHELL:-false}
    networks:
      - dca-internal

volumes:
  rabbitmq-data:

networks:
  dca-internal:
